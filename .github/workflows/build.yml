name: Build NyxClient 2.0

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-2.14.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-2.14.1/bin" >> "$GITHUB_PATH"

      - name: Build mod
        run: |
          gradle --no-daemon setupDecompWorkspace
          gradle --no-daemon build

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nyxclient-build
          path: build/libs/*.jar
          
